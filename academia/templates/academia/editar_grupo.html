{% extends 'base.html' %}

{% block title %}Editar Grupo / Sección{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card shadow-sm">
            <div class="card-header bg-warning text-dark">
                <h4 class="mb-0"><i class="bi bi-people me-2"></i>Editar Grupo / Sección: {{ object }}</h4>
            </div>
            <div class="card-body">
                <form method="post" novalidate>
                    {% csrf_token %}
                    {% include "academia/_form_fields.html" %}
                    <div class="d-flex justify-content-between mt-4">
                        <a href="{% url 'gruposeccion_list' %}" class="btn btn-secondary">Cancelar</a>
                        <button type="submit" class="btn btn-warning"><i class="bi bi-save me-1"></i> Actualizar cambios</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
