{% extends 'base.html' %}

{% block title %}Detalle de Estado de Inscripción{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0"><i class="bi bi-card-checklist me-2"></i>{{ object }}</h4>
            </div>
            <div class="card-body">
                <dl class="row mb-0">
                    <dt class="col-sm-4">Nombre:</dt>
                    <dd class="col-sm-8">{{ object.nombre_estado }}</dd>
                </dl>
            </div>
            <div class="card-footer d-flex justify-content-between">
                <a href="{% url 'estadoinscripcion_list' %}" class="btn btn-secondary">Regresar</a>
                <div>
                    <a href="{% url 'estadoinscripcion_update' object.pk %}" class="btn btn-warning">Editar</a>
                    <a href="{% url 'estadoinscripcion_delete' object.pk %}" class="btn btn-danger">Eliminar</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
